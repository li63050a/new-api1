name: Build Static Binary (Linux ARM64)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Set up Bun
      uses: oven-sh/setup-bun@v1

    - name: Build Frontend
      run: |
        cd web
        bun install
        bun run build

    - name: Build Linux ARM64 (static)
      run: |
        mkdir -p dist
        CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
          go build -ldflags "-s -w" -o dist/new-api-linux-arm64 main.go

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: new-api-linux-arm64
        path: dist/
