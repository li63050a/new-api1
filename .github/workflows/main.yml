name: Build Static Binaries (Multi-Platform)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:   # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Set up Bun (构建前端)
      uses: oven-sh/setup-bun@v1

    - name: Build Frontend (一次性构建)
      run: |
        cd web
        bun install
        bun run build

    - name: Build for multiple platforms (static)
      run: |
        mkdir -p dist
        
        # 目标平台列表
        platforms=(
          "linux/amd64"
          "linux/arm64"
          "linux/armv7"
          "windows/amd64"
          "windows/arm64"
          "darwin/amd64"
          "darwin/arm64"
        )
        
        for platform in "${platforms[@]}"; do
          GOOS=${platform%/*}
          GOARCH=${platform#*/}
          output="dist/new-api-${GOOS}-${GOARCH}"
          
          if [ "$GOARCH" = "armv7" ]; then
            GOARM=7
            output="dist/new-api-${GOOS}-armv7"
          else
            GOARM=""
          fi
          
          if [ "$GOOS" = "windows" ]; then
            output="${output}.exe"
          fi
          
          echo "Building $output ..."
          CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH GOARM=$GOARM \
            go build -ldflags "-s -w" -o "$output" main.go
        done

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: new-api-static-all
        path: dist/
