name: Build Static Binaries (Multi-Platform)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Set up Bun
      uses: oven-sh/setup-bun@v1

    - name: Build Frontend
      run: |
        cd web
        bun install
        bun run build

    - name: Build for multiple platforms (static)
      run: |
        mkdir -p dist
        
        # 正确写法：linux/arm 配合 GOARM=7 表示 ARMv7
        platforms=(
          "linux/amd64"
          "linux/arm64"
          "linux/arm"
          "windows/amd64"
          "windows/arm64"
          "darwin/amd64"
          "darwin/arm64"
        )
        
        for platform in "${platforms[@]}"; do
          GOOS=${platform%/*}
          GOARCH=${platform#*/}
          
          # 默认输出文件名
          output="dist/new-api-${GOOS}-${GOARCH}"
          
          # 处理 ARM 架构：指定 GOARM=7（ARMv7），并重命名文件为 armv7
          if [ "$GOARCH" = "arm" ]; then
            GOARM=7
            output="dist/new-api-${GOOS}-armv7"
          else
            GOARM=""
          fi
          
          # Windows 加 .exe
          if [ "$GOOS" = "windows" ]; then
            output="${output}.exe"
          fi
          
          echo "Building $output ..."
          CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH GOARM=$GOARM \
            go build -ldflags "-s -w" -o "$output" main.go
        done

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: new-api-static-all
        path: dist/
